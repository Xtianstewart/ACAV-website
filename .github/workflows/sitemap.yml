
name: Sitemap

# Keeps sitemap.xml generated from sitemap-pages.json (the page list), per
# docs/seo-buildout-spec.md Job 1 item 3. On pull requests the generated
# output must match the committed sitemap.xml or the job fails — include the
# regenerated file in any PR that changes the page list. On pushes to main
# the job regenerates and commits the sitemap if it drifted.
# Caveat: if branch protection blocks the Actions bot from pushing to main,
# the PR-time failure above is the backstop (see the spec).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate sitemap from the page list
        run: node scripts/generate-sitemap.mjs
      - name: Fail the PR if the committed sitemap was stale
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- sitemap.xml
      - name: Commit the regenerated sitemap on main
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          if ! git diff --quiet -- sitemap.xml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "chore: regenerate sitemap.xml [skip ci]"
            git push
          else
            echo "sitemap.xml already up to date"
          fi

